name: build

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: sudo apt-get update && sudo apt-get install -y python3-tk
      - run: ./build.sh --no-test
      - run: tar -czf ControlMaletas-linux.tar.gz -C dist ControlMaletas
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: ControlMaletas-linux.tar.gz }

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - name: Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build (.exe, Setup.exe, .msix)
        shell: bash
        env:
          MSIX_PFX_PATH: ${{ secrets.MSIX_PFX_PATH }}
          MSIX_PFX_PASSWORD: ${{ secrets.MSIX_PFX_PASSWORD }}
        run: ./build.sh --no-test
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/ControlMaletas-portable.exe
            dist/*.msix
            dist/*.cer
            installer/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with: { files: artifacts/** }
